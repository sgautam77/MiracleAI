name: Validate AI-Ready Database

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify SHA-256 checksums of all data files
        run: sha256sum -c data/metadata/checksums.sha256

      - name: Validate JSON & MLCommons Croissant metadata
        run: |
          python3 -m json.tool croissant.json > /dev/null
          python3 -m json.tool data/metadata/dataset_summary.json > /dev/null

      - name: Run Python loader & spatial split self-tests
        run: python3 src/loaders/python_loader.py --self-test
